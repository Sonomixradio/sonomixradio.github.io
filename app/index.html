<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Reproductor oficial de Sonomix Radio">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Sonomix Radio</title>
</head>
<body>
  <main class="app-shell" aria-label="Reproductor de Sonomix Radio">
    <header class="topbar"><div class="brand"><img src="logo-sonomix.png" alt=""><strong>SONOMIX RADIO</strong></div><span class="bars" aria-hidden="true">☰</span></header>
    <section class="radio-player">
      <p class="online"><i></i> RADIO ONLINE</p>
      <div id="record" class="record" aria-label="Disco de Sonomix Radio"><img class="vinyl" src="logo-sonomix.png" alt=""><span class="label"><img src="logo-sonomix.png" alt="Sonomix Radio"></span></div>
      <section class="track" aria-live="polite"><p>AHORA SONANDO</p><h1 id="title">Más allá del silencio</h1><span id="artist">Sonomix Radio</span></section>
      <button id="playButton" class="play" type="button" aria-label="Reproducir Sonomix Radio"><span id="playIcon">▶</span></button>
      <p id="status" class="status">Radio detenida</p>
      <div class="volume"><span class="speaker" aria-hidden="true">🔊</span><input id="volume" type="range" min="0" max="100" value="85" aria-label="Volumen"></div>
    </section>
  </main>
  <audio id="radio" preload="none" playsinline></audio>
  <script src="app.js"></script>
</body>
</html>
