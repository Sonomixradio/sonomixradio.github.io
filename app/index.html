        <a href="https://www.instagram.com/sonomixradio" target="_blank" rel="noopener" class="social-btn instagram" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor"/></svg></a>

        <a href="https://www.tiktok.com/@sonomixradio" target="_blank" rel="noopener" class="social-btn tiktok" aria-label="TikTok"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M9 0h1.98c.144.715.54 1.617 1.235 2.512C12.895 3.389 13.797 4 15 4v2c-1.753 0-3.07-.814-4-1.829V11a5 5 0 1 1-5-5v2a3 3 0 1 0 3 3z"/></svg></a>

</html>
