<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="Reproductor oficial de Sonomix Radio">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <title>Sonomix Radio</title>
</head>
<body>
  <main class="app-shell" aria-label="Reproductor de Sonomix Radio">
    <section class="player">
      <div class="logo"><img id="logo" src="logo-sonomix.png" alt="Sonomix Radio"></div>
      <h1 class="station">Sonomix Radio</h1>
      <div class="song" id="songContainer" aria-live="polite"><div class="song-track" id="song">Cargando...</div></div>
      <p class="artist" id="artist"></p>
      <button class="play" id="playBtn" type="button" aria-label="Reproducir Sonomix Radio"><span id="playIcon">▶</span></button>
      <p class="status" id="status">Conectando…</p>
      <div class="volume"><span aria-hidden="true">🔉</span><input type="range" min="0" max="1" step="0.01" value="0.9" id="volume" aria-label="Volumen"><span aria-hidden="true">🔊</span></div>
      <p class="live"><span></span> EN VIVO</p>
      <nav class="redes" aria-label="Redes sociales de Sonomix Radio">
        <a href="https://www.facebook.com/sonomixradio" target="_blank" rel="noopener" class="social-btn facebook" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="https://www.instagram.com/sonomixradio" target="_blank" rel="noopener" class="social-btn instagram" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="https://x.com/sonomixradio" target="_blank" rel="noopener" class="social-btn x" aria-label="X"><i class="fab fa-x-twitter"></i></a>
        <a href="https://www.tiktok.com/@sonomixradio" target="_blank" rel="noopener" class="social-btn tiktok" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
        <a href="https://wa.me/5493417124316" target="_blank" rel="noopener" class="social-btn whatsapp" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
      </nav>
      <a class="web-button" href="https://sonomixradio.com.ar/" target="_blank" rel="noopener"><i class="fa-solid fa-globe"></i> Visitar página web</a>
    </section>
  </main>
  <audio id="audio" preload="none" playsinline autoplay></audio>
  <script src="app.js"></script>
</body>
</html>
