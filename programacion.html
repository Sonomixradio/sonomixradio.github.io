<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

    <title>Programación - Sonomix Radio</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            position: fixed;
            inset: 0;
        }

        .programacion {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background: #000;
        }

        .programacion img {
            display: block;

            width: 100%;
            height: 100%;

            max-width: 100%;
            max-height: 100%;

            object-fit: contain;
            object-position: center;

            border: 0;
        }

    </style>
</head>

<body>

    <main class="programacion">

        <img
            src="programacion1.png"
            alt="Programación de Sonomix Radio">

    </main>

</body>
</html>
