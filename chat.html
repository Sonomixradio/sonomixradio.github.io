<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat - Sonomix Radio</title>

<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;

    background:
        linear-gradient(
            180deg,
            #0b1220,
            #151d33
        );

    color:white;

}

/* ================================
   CONTENEDOR PRINCIPAL
================================ */

#chat-radio{

    width:100%;

    min-height:100vh;

    padding:50px 20px;

}

/* ================================
   TITULO
================================ */

#chat-radio h2{

    text-align:center;

    color:#4fc3ff;

    font-size:2rem;

    margin-bottom:10px;

}

/* ================================
   DESCRIPCION
================================ */

.descripcion-chat{

    max-width:800px;

    margin:0 auto 25px;

    text-align:center;

    color:#ccc;

    line-height:1.6;

    padding:0 5px;

}

/* ================================
   CONTENEDOR CHAT
================================ */

.chat-contenedor{

    width:100%;

    max-width:900px;

    margin:30px auto;

    background:#111;

    border-radius:15px;

    overflow:hidden;

    border:1px solid #222;

    box-shadow:
        0 0 30px rgba(0,180,255,.12);

}

/* ================================
   HEADER
================================ */

.chat-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    padding:15px 20px;

    background:#181818;

    border-bottom:1px solid #292929;

}

.chat-live{

    color:#4caf50;

    font-size:13px;

    font-weight:bold;

    margin-right:10px;

}

.chat-titulo{

    color:white;

    font-weight:bold;

}

/* ================================
   MENSAJES
================================ */

#chat-mensajes{

    height:450px;

    overflow-y:auto;

    padding:15px;

    background:#0b0b0b;

}

/* ================================
   MENSAJE
================================ */

.chat-mensaje-item{

    position:relative;

    padding:10px 40px 10px 10px;

    margin-bottom:8px;

    background:#191919;

    border-radius:8px;

}

.chat-mensaje-usuario{

    color:#4fc3ff;

    font-weight:bold;

    margin-right:8px;

}

.chat-mensaje-hora{

    color:#777;

    font-size:11px;

}

.chat-mensaje-texto{

    color:#eee;

    margin-top:4px;

    word-wrap:break-word;

}

/* ================================
   FORMULARIO
================================ */

.chat-form{

    padding:15px;

    background:#181818;

    border-top:1px solid #292929;

}

/* NOMBRE */

#chat-nombre{

    width:100%;

    padding:11px;

    margin-bottom:8px;

    border-radius:7px;

    border:1px solid #333;

    background:#222;

    color:white;

    outline:none;

}

#chat-nombre:focus{

    border-color:#4fc3ff;

}

/* ================================
   ESCRIBIR
================================ */

.chat-escribir{

    display:flex;

    gap:8px;

}

#chat-mensaje{

    flex:1;

    width:100%;

    padding:11px;

    border-radius:7px;

    border:1px solid #333;

    background:#222;

    color:white;

    outline:none;

}

#chat-mensaje:focus{

    border-color:#4fc3ff;

}

/* ================================
   BOTON ENVIAR
================================ */

#chat-enviar{

    padding:0 20px;

    border:none;

    border-radius:7px;

    background:#00aef0;

    color:white;

    cursor:pointer;

    font-weight:bold;

    transition:.2s;

}

#chat-enviar:hover{

    background:#008dcc;

}

#chat-enviar:disabled{

    opacity:.5;

    cursor:not-allowed;

}

/* ================================
   ERROR
================================ */

#chat-error{

    color:#ff6b6b;

    font-size:12px;

    margin-top:8px;

}

/* ================================
   SCROLL
================================ */

#chat-mensajes::-webkit-scrollbar{

    width:7px;

}

#chat-mensajes::-webkit-scrollbar-track{

    background:#0b0b0b;

}

#chat-mensajes::-webkit-scrollbar-thumb{

    background:#333;

    border-radius:10px;

}

/* ================================
   MOVIL
================================ */

@media(max-width:600px){

    #chat-radio{

        padding:30px 10px;

    }

    #chat-radio h2{

        font-size:24px;

    }

    .descripcion-chat{

        font-size:14px;

    }

    .chat-contenedor{

        margin:20px auto;

        border-radius:12px;

    }

    .chat-header{

        padding:13px 15px;

    }

    #chat-mensajes{

        height:400px;

        padding:12px;

    }

    .chat-escribir{

        flex-direction:column;

    }

    #chat-enviar{

        height:45px;

    }

}

</style>

</head>

<body>


<section id="chat-radio">

    <h2>Chat</h2>

    <p class="descripcion-chat">

        Sumate al chat en vivo y conectate con otros oyentes
        de Sonomix Radio. Compartí mensajes, saludos y viví
        la experiencia de la radio en tiempo real.

    </p>


    <div class="chat-contenedor">


        <!-- HEADER -->

        <div class="chat-header">

            <div>

                <span class="chat-live">
                    ● EN VIVO
                </span>

                <span class="chat-titulo">
                    Sonomix Radio
                </span>

            </div>

        </div>


        <!-- MENSAJES -->

        <div id="chat-mensajes">

        </div>


        <!-- FORMULARIO -->

        <div class="chat-form">


            <input

                type="text"

                id="chat-nombre"

                placeholder="Tu nombre o apodo"

                maxlength="20"

                autocomplete="off"

            >


            <div class="chat-escribir">


                <input

                    type="text"

                    id="chat-mensaje"

                    placeholder="Escribí tu mensaje..."

                    maxlength="250"

                    autocomplete="off"

                >


                <button id="chat-enviar">

                    Enviar

                </button>


            </div>


            <div id="chat-error"></div>


        </div>


    </div>

</section>


<!-- =================================
     FIREBASE
================================= -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {

    getAuth,

    signInAnonymously,

    onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {

    getDatabase,

    ref,

    push,

    onChildAdded,

    onChildRemoved,

    query,

    orderByChild,

    limitToLast

}

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* ================================
   FIREBASE
================================ */

const firebaseConfig = {

    apiKey:
        "AIzaSyCtfBnFo6dSLxj7MnK3HvdDMcfQhyPRDoI",

    authDomain:
        "sonomix-radio-chat.firebaseapp.com",

    projectId:
        "sonomix-radio-chat",

    storageBucket:
        "sonomix-radio-chat.firebasestorage.app",

    messagingSenderId:
        "313489578782",

    appId:
        "1:313489578782:web:8fef3c9315edf5089a870f"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getDatabase(app);


/* ================================
   ELEMENTOS
================================ */

const mensajesDiv =
    document.getElementById(
        "chat-mensajes"
    );


const nombreInput =
    document.getElementById(
        "chat-nombre"
    );


const mensajeInput =
    document.getElementById(
        "chat-mensaje"
    );


const enviarBtn =
    document.getElementById(
        "chat-enviar"
    );


const errorDiv =
    document.getElementById(
        "chat-error"
    );


/* ================================
   USUARIO FIREBASE
================================ */

let usuarioFirebase = null;


/* ================================
   NOMBRE GUARDADO
================================ */

const nombreGuardado =
    localStorage.getItem(
        "sonomixChatNombre"
    );


if(nombreGuardado){

    nombreInput.value =
        nombreGuardado;

}


/* ================================
   AUTENTICACION ANONIMA
================================ */

signInAnonymously(auth)

.catch(error => {

    console.error(
        "ERROR FIREBASE:",
        error
    );

    errorDiv.textContent =
        "No se pudo conectar con el chat.";

});


/* ================================
   ESTADO AUTENTICACION
================================ */

onAuthStateChanged(

    auth,

    user => {

        usuarioFirebase =
            user;


        if(user){

            enviarBtn.disabled =
                false;

            errorDiv.textContent =
                "";

        }else{

            enviarBtn.disabled =
                true;

            errorDiv.textContent =
                "Conectando con el chat...";

        }

    }

);


/* ================================
   NORMALIZAR NOMBRE
================================ */

function normalizarNick(nombre){

    return nombre

        .trim()

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .replace(
            /[^a-z0-9]/g,
            ""
        );

}


/* ================================
   MOSTRAR MENSAJE
================================ */

function mostrarMensaje(

    datos,

    mensajeId

){

    if(!datos){

        return;

    }


    /* Evitar duplicados */

    const existente =
        document.querySelector(
            `.chat-mensaje-item[data-id="${mensajeId}"]`
        );


    if(existente){

        return;

    }


    const item =
        document.createElement(
            "div"
        );


    item.className =
        "chat-mensaje-item";


    item.dataset.id =
        mensajeId;


    /* USUARIO */

    const usuario =
        document.createElement(
            "span"
        );


    usuario.className =
        "chat-mensaje-usuario";


    usuario.textContent =
        datos.nombre ||
        "Anónimo";


    /* HORA */

    const hora =
        document.createElement(
            "span"
        );


    hora.className =
        "chat-mensaje-hora";


    const fecha =
        new Date(
            datos.timestamp ||
            Date.now()
        );


    hora.textContent =
        fecha.toLocaleTimeString(

            "es-AR",

            {

                hour:"2-digit",

                minute:"2-digit"

            }

        );


    /* TEXTO */

    const texto =
        document.createElement(
            "div"
        );


    texto.className =
        "chat-mensaje-texto";


    texto.textContent =
        datos.texto ||
        "";


    /* AGREGAR */

    item.appendChild(
        usuario
    );


    item.appendChild(
        hora
    );


    item.appendChild(
        texto
    );


    mensajesDiv.appendChild(
        item
    );


    /* AUTO SCROLL */

    mensajesDiv.scrollTop =
        mensajesDiv.scrollHeight;

}


/* ================================
   REFERENCIA FIREBASE
================================ */

const mensajesRef =
    ref(
        db,
        "chat/mensajes"
    );


const mensajesQuery =
    query(

        mensajesRef,

        orderByChild(
            "timestamp"
        ),

        limitToLast(100)

    );


/* ================================
   CARGAR MENSAJES
================================ */

onChildAdded(

    mensajesQuery,

    snapshot => {

        const datos =
            snapshot.val();


        mostrarMensaje(

            datos,

            snapshot.key

        );

    }

);


/* ================================
   ELIMINAR EN TIEMPO REAL
================================ */

onChildRemoved(

    mensajesRef,

    snapshot => {

        const elemento =
            document.querySelector(

                `.chat-mensaje-item[data-id="${snapshot.key}"]`

            );


        if(elemento){

            elemento.remove();

        }

    }

);


/* ================================
   ENVIAR MENSAJE
================================ */

async function enviarMensaje(){


    const nombre =
        nombreInput.value.trim();


    const texto =
        mensajeInput.value.trim();


    errorDiv.textContent =
        "";


    /* AUTENTICACION */

    if(!usuarioFirebase){

        errorDiv.textContent =
            "Conectando con el chat...";

        return;

    }


    /* NOMBRE */

    if(!nombre){

        errorDiv.textContent =
            "Escribí tu nombre o apodo.";

        nombreInput.focus();

        return;

    }


    if(nombre.length < 2){

        errorDiv.textContent =
            "El nombre debe tener al menos 2 caracteres.";

        nombreInput.focus();

        return;

    }


    if(nombre.length > 20){

        errorDiv.textContent =
            "El nombre no puede superar 20 caracteres.";

        nombreInput.focus();

        return;

    }


    /* MENSAJE */

    if(!texto){

        mensajeInput.focus();

        return;

    }


    if(texto.length > 250){

        errorDiv.textContent =
            "El mensaje es demasiado largo.";

        return;

    }


    /* NORMALIZAR */

    const nickKey =
        normalizarNick(
            nombre
        );


    if(!nickKey){

        errorDiv.textContent =
            "Ese nombre no es válido.";

        return;

    }


    /* NOMBRES RESERVADOS */

    if(

        nickKey === "sonomixradio" ||

        nickKey === "sonomix"

    ){

        errorDiv.textContent =
            "Ese nombre está reservado para Sonomix Radio.";

        return;

    }


    try{


        /* GUARDAR NOMBRE */

        localStorage.setItem(

            "sonomixChatNombre",

            nombre

        );


        /* ENVIAR */

        await push(

            mensajesRef,

            {

                nombre:
                    nombre,

                texto:
                    texto,

                timestamp:
                    Date.now(),

                uid:
                    usuarioFirebase.uid,

                nickKey:
                    nickKey

            }

        );


        /* LIMPIAR */

        mensajeInput.value =
            "";

        mensajeInput.focus();


    }catch(error){


        console.error(

            "ERROR ENVIANDO:",
            error

        );


        errorDiv.textContent =
            "No se pudo enviar el mensaje.";

    }

}


/* ================================
   BOTON
================================ */

enviarBtn.addEventListener(

    "click",

    enviarMensaje

);


/* ================================
   ENTER
================================ */

mensajeInput.addEventListener(

    "keydown",

    event => {

        if(event.key === "Enter"){

            event.preventDefault();

            enviarMensaje();

        }

    }

);

</script>


</body>
</html>
