<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonomix Radio</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
    --main:#4f7cff;
    --bg1:#0b1220;
    --bg2:#151d33;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:linear-gradient(180deg,var(--bg1),var(--bg2));color:#fff;}

header h1{font-size:1.3rem;margin-top:5px;}

nav{background:#020817;}
.nav-container{max-width:1100px;margin:auto;padding:10px 15px;display:flex;align-items:center;justify-content:space-between;}
.menu{display:flex;gap:20px;}
.menu a{color:#fff;text-decoration:none;font-size:.95rem;}
.menu a:hover{color:var(--main);}
.hamburger{display:none;font-size:26px;cursor:pointer;}

.player{
    width:92%;
    max-width:420px;
    background:linear-gradient(180deg,#121c33,#020814);
    border-radius:30px;
    padding:26px 22px;
    text-align:center;
    box-shadow:0 40px 80px rgba(0,0,0,.85);
    margin:30px auto;
}


.top-banner{
    background:transparent;
    padding:0;
    text-align:center;
}

.top-banner img{
    width:100%;
    max-width:1000px;
    height:auto;
    display:block;
    margin:0 auto;
    border-radius:0 !important;
}
    

/* LOGO REDONDO */
.logo{
    width:180px;
    height:180px;
    margin:0 auto 16px;
    border-radius:50%;
    background:#fff;
    overflow:hidden;
    box-shadow:0 0 50px rgba(29,185,84,.45);
}
.logo img{width:100%;height:100%;object-fit:contain;}

.station{font-size:22px;font-weight:600;margin-bottom:8px;}
.song{font-size:18px;font-weight:500;margin-bottom:4px;}
.artist{font-size:14px;opacity:.8;margin-bottom:18px;}

.visualizer{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:6px;
    height:70px;
    margin-bottom:20px;
}
.wave{
    width:8px;
    height:20%;
    border-radius:20px;
    opacity:.85;
}

.play{
    width:90px;height:90px;border-radius:50%;
    border:none;background:#1db954;color:#000;
    font-size:36px;cursor:pointer;
    box-shadow:0 0 40px rgba(29,185,84,.65);
    margin-bottom:16px;
}

.volume{
    display:flex;justify-content:center;align-items:center;
    gap:10px;margin-bottom:16px;
}
.volume input{width:200px;}

.live{
    font-size:13px;color:#ff2f7a;font-weight:600;
}
.live span{
    display:inline-block;width:10px;height:10px;
    background:#ff2f7a;border-radius:50%;
    animation:pulse 1.3s infinite;
}
@keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}

section{max-width:900px;margin:60px auto;padding:0 20px;}
section h2{text-align:center;color:var(--main);margin-bottom:20px;}

.contacto input,
.contacto textarea{
    width:100%;padding:12px;margin-bottom:10px;
    border:none;border-radius:6px;
}
.contacto button{
    width:100%;padding:12px;
    background:var(--main);border:none;
    color:#fff;border-radius:6px;
}

#formMessage{
    text-align:center;
    margin-top:10px;
    font-weight:600;
    opacity:0;
    transition:opacity .4s ease;
}

.redes{text-align:center;}
.redes a{font-size:28px;margin:0 14px;color:var(--main);}

footer{background:#020817;text-align:center;padding:20px;font-size:.9rem;color:#bcdcff;}

@media(max-width:768px){
    .menu{flex-direction:column;display:none;}
    .menu.active{display:flex;}
    .hamburger{display:block;}
}
</style>
</head>

<body>

<header class="top-banner">
    <img src="sonomix-banner.jpg" alt="Sonomix Radio">
</header>

<nav>
    <div class="nav-container">
        <div class="hamburger" onclick="toggleMenu()">
            <i class="fas fa-bars"></i>
        </div>
        <div class="menu" id="menu">
            <a href="#player">En Vivo</a>
            <a href="#chat">Chat</a>
            <a href="#contacto">Contacto</a>
            <a href="#redes">Redes</a>
        </div>
    </div>
</nav>

<!-- PLAYER -->
<div class="player" id="player">
    <div class="logo">
        <img src="http://sonomixradio.xo.je/img/logo.png" alt="Sonomix Radio">
    </div>
    <div class="station">Sonomix Radio</div>
    <div class="song" id="song">Cargando…</div>
    <div class="artist" id="artist"></div>

    <div class="visualizer">
        <div class="wave"></div><div class="wave"></div><div class="wave"></div>
        <div class="wave"></div><div class="wave"></div><div class="wave"></div>
        <div class="wave"></div><div class="wave"></div>
    </div>

    <audio id="audio" src="https://s2.servicioderadio.com/8664/stream" crossorigin="anonymous"></audio>
    <button class="play" id="playBtn"><i class="fa-solid fa-play"></i></button>

    <div class="volume">
        <i class="fa-solid fa-volume-low"></i>
        <input type="range" min="0" max="1" step="0.01" value="0.9" id="volume">
        <i class="fa-solid fa-volume-high"></i>
    </div>

    <div class="live"><span></span> EN VIVO</div>
</div>

<section id="chat">
    <h2>Chat en Vivo</h2>
</section>

<section class="contacto" id="contacto">
    <h2>Contacto</h2>
    <form id="contactForm" action="https://formspree.io/f/mjgeraek" method="POST">
        <input type="text" name="Nombre" placeholder="Nombre" required>
        <input type="email" name="email" placeholder="Email" required>
        <textarea name="message" rows="4" placeholder="Mensaje" required></textarea>
        <button type="submit">Enviar</button>
    </form>
    <div id="formMessage"></div>
</section>

<section class="redes" id="redes">
    <h2>Seguinos</h2>
    <a href="#"><i class="fab fa-facebook"></i></a>
    <a href="#"><i class="fab fa-instagram"></i></a>
    <a href="#"><i class="fab fa-whatsapp"></i></a>
</section>

<footer>
    © 2026 Sonomix Radio – Todos los derechos reservados
</footer>

<!-- SCRIPT FORMULARIO -->
<script>
const form = document.getElementById("contactForm");
const messageBox = document.getElementById("formMessage");
let hideTimeout;

form.addEventListener("submit", function(e){
    e.preventDefault();
    clearTimeout(hideTimeout);

    messageBox.style.opacity = 1;
    messageBox.style.color = "#4f7cff";
    messageBox.textContent = "Enviando mensaje...";

    fetch(form.action,{
        method:form.method,
        body:new FormData(form),
        headers:{ "Accept":"application/json" }
    })
    .then(res=>{
        if(res.ok){
            messageBox.style.color="#1db954";
            messageBox.textContent="✅ Mensaje enviado correctamente";
            form.reset();
            hideTimeout=setTimeout(()=>{
                messageBox.style.opacity=0;
                messageBox.textContent="";
            },4000);
        }else{
            messageBox.style.color="#ff4f4f";
            messageBox.textContent="❌ Error al enviar";
        }
    })
    .catch(()=>{
        messageBox.style.color="#ff4f4f";
        messageBox.textContent="❌ Error de conexión";
    });
});
</script>

<!-- SCRIPT REPRODUCTOR -->
<script>
function toggleMenu(){
    document.getElementById("menu").classList.toggle("active");
}

const audio = document.getElementById("audio");
const playBtn = document.getElementById("playBtn");
const volume = document.getElementById("volume");
const song = document.getElementById("song");
const artist = document.getElementById("artist");
const waves = document.querySelectorAll(".wave");

audio.volume = volume.value;

playBtn.onclick = () => {
    if(audio.paused){
        audio.play();
        playBtn.innerHTML='<i class="fa-solid fa-pause"></i>';
        if(!audioCtx) initAudioCtx();
    }else{
        audio.pause();
        playBtn.innerHTML='<i class="fa-solid fa-play"></i>';
    }
};

volume.oninput = () => audio.volume = volume.value;

/* METADATOS */
function loadMetadata(){
    fetch("https://s2.servicioderadio.com/cp/get_info.php?p=8664")
    .then(r=>r.json())
    .then(data=>{
        song.textContent = data.title || "En vivo";
        artist.textContent = data.artist || "";
    })
    .catch(()=>{
        song.textContent="En vivo";
        artist.textContent="";
    });
}
loadMetadata();
setInterval(loadMetadata,15000);

/* VISUALIZER */
let audioCtx, analyser, source, dataArray;
function initAudioCtx(){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    source = audioCtx.createMediaElementSource(audio);
    analyser = audioCtx.createAnalyser();
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    analyser.fftSize = 64;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    animate();
}
function animate(){
    analyser.getByteFrequencyData(dataArray);
    waves.forEach((w,i)=>{
        const v = dataArray[i] || 0;
        w.style.height = `${Math.max(20,v/2)}%`;
        w.style.background = `hsl(${120-(v/255)*120},100%,50%)`;
    });
    requestAnimationFrame(animate);
}
</script>

</body>
</html>
