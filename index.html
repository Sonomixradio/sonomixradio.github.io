<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonomix Radio</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
    --main:#4f7cff;
    --bg1:#0b1220;
    --bg2:#151d33;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:linear-gradient(180deg,var(--bg1),var(--bg2));color:#fff;}

nav{background:#020817;}
.nav-container{max-width:1100px;margin:auto;padding:10px 15px;display:flex;align-items:center;justify-content:space-between;}
.menu{display:flex;gap:20px;}
.menu a{color:#fff;text-decoration:none;font-size:.95rem;}
.menu a:hover{color:var(--main);}
.hamburger{display:none;font-size:26px;cursor:pointer;}

/* ===== SECCIÓN CONTACTO ===== */
#contacto {
  max-width: 600px;
  margin: 0 auto;
  padding: 40px 20px;
  text-align: center;
}

#contacto h2 {
  margin-bottom: 20px;
}

/* Formulario */
#form-contacto {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

/* Inputs y textarea */
#form-contacto input,
#form-contacto textarea {
  width: 100%;
  padding: 12px 15px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 16px;
  box-sizing: border-box;
}

/* Altura del textarea */
#form-contacto textarea {
  min-height: 120px;
  resize: vertical;
}

/* Botón */
#form-contacto button {
  background-color: #1e73ff;
  color: white;
  border: none;
  padding: 14px;
  border-radius: 12px;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

#form-contacto button:hover {
  background-color: #1557c0;
}

/* ===== RESPONSIVE PARA CELULARES ===== */
@media (max-width: 768px) {
  #contacto {
    padding: 30px 15px;
  }

  #form-contacto input,
  #form-contacto textarea {
    font-size: 16px; /* evita zoom raro en iPhone/Android */
  }

  #form-contacto button {
    width: 100%;
    font-size: 17px;
  }
}


.player{
    width:92%;
    max-width:420px;
    background:
        linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.75)),
        url('/fondo.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    border-radius:30px;
    padding:26px 22px 30px;
    text-align:center;
    box-shadow:0 40px 80px rgba(0,0,0,.85);
    margin:30px auto 10px;
}
/* BANNER */
.top-banner{
    width:100%;
    background:transparent;
    padding:0;
    margin:0;
    text-align:center;
}
.top-banner img{
    width:100%;
    max-width:100%;
    height:auto;
    display:block;
    margin:0;
    border-radius:0 !important;
}

/* LOGO VINILO PERFECTO (AJUSTADO + GIRO ANTIHORARIO) */
.logo{
    width:180px;
    height:180px;
    margin:0 auto 16px;
    border-radius:50%;
    overflow:hidden;
    background:#000;
    box-shadow:0 0 50px rgba(29,185,84,.35);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    animation:spin 12s linear infinite;
    animation-play-state:paused;
}

/* CAMBIO: ahora gira en sentido contrario (como tocadiscos real) */
@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(-360deg);}
}

.station{
    font-size:22px;
    font-weight:600;
    margin-bottom:10px;
}

/* CONTENEDOR SCROLL CORREGIDO (LOOP INFINITO SIN CORTES) */
.song{
    width:100%;
    overflow:hidden;
    white-space:nowrap;
    position:relative;
    height:24px;
    margin-bottom:6px;
}

.song-track{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    padding-right:50px;
}

.song.scroll .song-track{
    animation:scrollSong 15s linear infinite;
}

@keyframes scrollSong{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-100%);
    }
}

.artist{
    font-size:14px;
    opacity:.8;
    margin-bottom:18px;
}

.play{
    width:90px;
    height:90px;
    border-radius:50%;
    border:none;
    background:#1db954;
    color:#000;
    font-size:36px;
    cursor:pointer;
    box-shadow:0 0 40px rgba(29,185,84,.65);
    margin-bottom:16px;
}

.volume{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-bottom:16px;
}
.volume input{width:200px;}

.live{
    font-size:13px;
    color:#ff2f7a;
    font-weight:600;
}
.live span{
    display:inline-block;
    width:10px;
    height:10px;
    background:#ff2f7a;
    border-radius:50%;
    animation:pulse 1.3s infinite;
}
@keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}

/* BOTÓN DESCARGA (NO TOCADO) */
.download-app{
    text-align:center;
    margin:10px auto 30px;
    max-width:420px;
}
.download-app img{
    width:100%;
    max-width:380px;
    height:auto;
    cursor:pointer;
    transition:transform .2s ease, box-shadow .2s ease;
}
.download-app img:hover{
    transform:scale(1.04);
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

section{max-width:900px;margin:60px auto;padding:0 20px;}
section h2{text-align:center;color:var(--main);margin-bottom:20px;}

.contacto input,
.contacto textarea{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:none;
    border-radius:6px;
}
.contacto button{
    width:100%;
    padding:12px;
    background:var(--main);
    border:none;
    color:#fff;
    border-radius:6px;
}

#formMessage{
    text-align:center;
    margin-top:10px;
    font-weight:600;
    opacity:0;
    transition:opacity .4s ease;
}

.redes{
    text-align:center;
}

.social-btn{
    display:inline-flex;
    justify-content:center;
    align-items:center;
    width:55px;
    height:55px;
    margin:0 12px;
    border-radius:50%;
    font-size:24px;
    color:#fff;
    text-decoration:none;
    box-shadow:0 8px 20px rgba(0,0,0,.4);
    transition:all .3s ease;
}

/* Colores oficiales */
.facebook{
    background:#1877F2;
}

.instagram{
    background:linear-gradient(45deg,#F58529,#DD2A7B,#8134AF,#515BD4);
}

.x{
    background:#000000;
}

/* Hover efecto */
.social-btn:hover{
    transform:translateY(-6px) scale(1.08);
    box-shadow:0 15px 35px rgba(0,0,0,.6);
}

footer{
    background:#020817;
    text-align:center;
    padding:20px;
    font-size:.9rem;
    color:#bcdcff;
}

.footer-text p{
    margin:4px 0;
    text-align:center;
}

@media(max-width:768px){
    .menu{flex-direction:column;display:none;}
    .menu.active{display:flex;}
    .hamburger{display:block;}
}

.video-radio{
    max-width:900px;
    margin:0 auto;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.6);
}

.video-radio iframe{
    width:100%;
    height:500px;
    border:none;
    display:block;
}

/* Adaptación móvil */
@media(max-width:768px){
    .video-radio iframe{
        height:260px;
    }
}

/* SECCIÓN DONACIÓN */
.donacion{
    text-align:center;
    margin: 0 auto 40px;
    max-width:420px;
}

.texto-donacion{
    font-size:15px;
    margin-bottom:12px;
    opacity:0.9;
}

.donacion img{
    width:100%;
    max-width:260px;
    height:auto;
    cursor:pointer;
    transition:transform .2s ease, box-shadow .2s ease;
}

.donacion img:hover{
    transform:scale(1.05);
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

/* FRASE ANIMADA VIDEO */
.frase-video{
    width:100%;
    overflow:hidden;
    white-space:nowrap;
    position:relative;
    background:#ff0000;
    color:#ffffff;
    padding:10px 0;
    margin-bottom:20px;
    border-radius:8px;
    font-weight:600;
}

.frase-track{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    padding-right:50px;
    animation:scrollFrase 12s linear infinite;
}

@keyframes scrollFrase{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-100%);
    }
}

</style>
</head>

<body>

<header class="top-banner">
    <img src="sonomix-banner.jpeg" alt="Sonomix Radio">
</header>

<nav>
    <div class="nav-container">
        <div class="hamburger" onclick="toggleMenu()">
            <i class="fas fa-bars"></i>
        </div>
        <div class="menu" id="menu">
            <a href="#player">En Vivo</a>
            <a href="#chat">Mira la Radio</a>
            <a href="#contacto">Contacto</a>
            <a href="#redes">Redes</a>
        </div>
    </div>
</nav>

<!-- PLAYER (MISMO PLAYER, SOLO MEJORADO INTERNAMENTE) -->
<div class="player" id="player">
    <div class="logo">
        <img src="/logo-sonomix.png" alt="Sonomix Radio">
    </div>

    <div class="station">Sonomix Radio</div>

    <div class="song" id="songContainer">
        <div class="song-track" id="song">Cargando...</div>
    </div>

    <div class="artist" id="artist"></div>

    <audio id="audio" src="https://s2.servicioderadio.com/8664/stream" crossorigin="anonymous"></audio>

    <button class="play" id="playBtn">
        <i class="fa-solid fa-play"></i>
    </button>

    <div class="volume">
        <i class="fa-solid fa-volume-low"></i>
        <input type="range" min="0" max="1" step="0.01" value="0.9" id="volume">
        <i class="fa-solid fa-volume-high"></i>
    </div>

    <div class="live"><span></span> EN VIVO</div>
</div>

<!-- BOTÓN DESCARGA (SIN CAMBIOS) -->
<div class="download-app">
    <a href="https://apk.e-droid.net/apk/app3935238-ngmrwx.apk?v=1" download target="_blank">
        <img src="descarga.png" alt="Descargar App">
    </a>
</div>

<!-- DONACIÓN MERCADO PAGO -->
<div class="donacion">
    <p class="texto-donacion">Si te gusta la radio, podés dejar una donación</p>
    
    <a href="https://link.mercadopago.com.ar/sonomixradio" target="_blank">
        <img src="mercadopago.png" alt="Donar con Mercado Pago">
    </a>
</div>


<section id="chat">
    <h2>Mirá la Radio</h2>

    <div class="video-radio">
        <iframe 
            src="https://vivo.miradiolive.com/?view=693"
            title="Transmisión en vivo Sonomix Radio"
            frameborder="0"
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>
    </div>

    <!-- FRASE ANIMADA (AHORA DEBAJO DEL VIDEO) -->
    <div class="frase-video" id="fraseContainer">
        <div class="frase-track">
            Cuando estemos transmitiendo en video nos veras aquí
        </div>
    </div>
</section>

<section id="contacto">
  <h2>Contacto</h2>

  <form id="form-contacto" action="https://formspree.io/f/xzdagkze" method="POST">
    <input type="text" name="nombre" placeholder="Tu nombre" required>
    <input type="email" name="email" placeholder="Tu email" required>
    <textarea name="mensaje" placeholder="Tu mensaje" required></textarea>
    
    <button type="submit">Enviar mensaje</button>
  </form>

  <p id="mensaje-enviado" style="display:none; color:green; font-weight:bold; margin-top:10px;">
    Mensaje enviado
  </p>
</section>
<section class="redes" id="redes">
    <h2>Seguinos</h2>

    <!-- Facebook -->
    <a href="#" target="_blank" class="social-btn facebook" aria-label="Facebook">
        <i class="fab fa-facebook-f"></i>
    </a>

    <!-- Instagram -->
    <a href="https://www.instagram.com/sonomixradio?igsh=MTRjdmpscDl1M3N1cA==" target="_blank" class="social-btn instagram" aria-label="Instagram">
        <i class="fab fa-instagram"></i>
    </a>

    <!-- X -->
    <a href="https://x.com/sonomixradio" target="_blank" class="social-btn x" aria-label="X">
        <i class="fab fa-x-twitter"></i>
    </a>
</section>

<footer>
    <div class="footer-text">
        <p>© 2026 Sonomix Radio</p>
        <p>Todos los derechos reservados.</p>
    </div>
</footer>
<script>
function toggleMenu(){
    document.getElementById("menu").classList.toggle("active");
}

const audio = document.getElementById("audio");
const playBtn = document.getElementById("playBtn");
const volume = document.getElementById("volume");
const song = document.getElementById("song");
const artist = document.getElementById("artist");
const container = document.getElementById("songContainer");
const logo = document.querySelector(".logo img");

audio.volume = volume.value;

playBtn.onclick = () => {
    if(audio.paused){
        audio.play();
        playBtn.innerHTML='<i class="fa-solid fa-pause"></i>';
        logo.style.animationPlayState = "running";
    }else{
        audio.pause();
        playBtn.innerHTML='<i class="fa-solid fa-play"></i>';
        logo.style.animationPlayState = "paused";
    }
};

volume.oninput = () => audio.volume = volume.value;

function loadMetadata(){
    fetch("https://s2.servicioderadio.com/cp/get_info.php?p=8664")
    .then(r=>r.json())
    .then(data=>{
        const title = data.title || "En vivo";
        song.textContent = title;
        artist.textContent = data.artist || "";

        // Forzar recalculo real del ancho (evita que quede quieto)
        container.classList.remove("scroll");

        // Espera a que el texto se renderice correctamente
        requestAnimationFrame(() => {
            const textWidth = song.scrollWidth;
            const containerWidth = container.clientWidth;

            // Si el texto es más largo que el reproductor, activa movimiento
            if(textWidth > containerWidth){
                container.classList.add("scroll");
            }
        });
    })
    .catch(()=>{
        song.textContent="En vivo";
        artist.textContent="";
        container.classList.remove("scroll");
    });
}

loadMetadata();
setInterval(loadMetadata,15000);
</script>



<script>
const form = document.getElementById("form-contacto");
const mensaje = document.getElementById("mensaje-enviado");

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const data = new FormData(form);

  try {
    const response = await fetch(form.action, {
      method: "POST",
      body: data,
      headers: {
        'Accept': 'application/json'
      }
    });

    if (response.ok) {
      form.reset();
      
      // Mostrar mensaje
      mensaje.style.display = "block";

      // Ocultarlo después de 4 segundos
      setTimeout(() => {
        mensaje.style.display = "none";
      }, 4000);

    } else {
      alert("Error al enviar el mensaje");
    }
  } catch (error) {
    alert("Error de conexión");
  }
});
</script>


</body>
</html>
