<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonomix Radio</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
/* (TODO TU CSS ORIGINAL SIN CAMBIOS) */
</style>
</head>

<body>

<header class="top-banner">
    <img src="sonomix-banner.jpeg" alt="Sonomix Radio">
</header>

<nav>
    <div class="nav-container">
        <div class="hamburger" onclick="toggleMenu()">
            <i class="fas fa-bars"></i>
        </div>
        <div class="menu" id="menu">
            <!-- ❌ ELIMINADO: En Vivo -->
            <a href="#chat">Mira la Radio</a>
            <a href="#chatbox">Chat</a>
            <a href="#contacto">Contacto</a>
            <a href="#redes">Redes</a>
        </div>
    </div>
</nav>

<!-- PLAYER (SIN CAMBIOS) -->
<div class="player" id="player">
    <div class="logo">
        <img src="/logo-sonomix.png" alt="Sonomix Radio">
    </div>

    <div class="station">Sonomix Radio</div>

    <div class="song" id="songContainer">
        <div class="song-track" id="song">Cargando...</div>
    </div>

    <div class="artist" id="artist"></div>

    <audio id="audio" src="https://s2.servicioderadio.com/8664/stream" crossorigin="anonymous"></audio>

    <button class="play" id="playBtn">
        <i class="fa-solid fa-play"></i>
    </button>

    <div class="volume">
        <i class="fa-solid fa-volume-low"></i>
        <input type="range" min="0" max="1" step="0.01" value="0.9" id="volume">
        <i class="fa-solid fa-volume-high"></i>
    </div>

    <div class="live"><span></span> EN VIVO</div>
</div>

<!-- (TODO LO DEMÁS IGUAL HASTA LA SECCIÓN VIDEO) -->

<section id="chat">
    <h2>Mirá la Radio</h2>

    <div class="video-radio">
        <iframe 
            src="https://vivo.miradiolive.com/?view=693"
            title="Transmisión en vivo Sonomix Radio"
            frameborder="0"
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>
    </div>

    <div class="frase-video" id="fraseContainer">
        <div class="frase-track">
            Cuando estemos transmitiendo en video nos veras aquí
        </div>
    </div>
</section>

<!-- 🔥 NUEVA SECCIÓN CHAT -->
<section id="chatbox">
    <h2>Chat</h2>

    <script id="cid0020000436964427311" data-cfasync="false" async src="//st.chatango.com/js/gz/emb.js" style="width: 100%;height: 500px;">
    {"handle":"sonomixradio","arch":"js","styles":{"a":"0084ef","b":100,"c":"FFFFFF","d":"FFFFFF","k":"0084ef","l":"0084ef","m":"0084ef","n":"FFFFFF","p":"10","q":"0084ef","r":100,"usricon":0,"surl":0,"allowpm":0}}
    </script>
</section>

<!-- CONTACTO (SIN CAMBIOS) -->
<section id="contacto">
  <h2>Contacto</h2>

  <form id="form-contacto" action="https://formspree.io/f/xzdagkze" method="POST">
    <input type="text" name="nombre" placeholder="Tu nombre" required>
    <input type="email" name="email" placeholder="Tu email" required>
    <textarea name="mensaje" placeholder="Tu mensaje" required></textarea>
    
    <button type="submit">Enviar mensaje</button>
  </form>

  <p id="mensaje-enviado" style="display:none; color:green; font-weight:bold; margin-top:10px;">
    Mensaje enviado
  </p>
</section>

<!-- (RESTO DEL HTML SIN CAMBIOS: REDES, FOOTER, SCRIPTS, ETC) -->

</body>
</html>
