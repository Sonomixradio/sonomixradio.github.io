<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Colaborá con Sonomix Radio</title>

  <style>
    :root {
      --bg: #050505;
      --panel: #121212;
      --border: #2b2b2b;
      --text: #ffffff;
      --muted: #b8b8b8;
      --red: #ff0a0a;
      --mp: #00b1ea;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding:
        max(20px, env(safe-area-inset-top))
        18px
        max(24px, env(safe-area-inset-bottom));

      display: grid;
      place-items: center;

      background-image:
        linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.65)),
        url("fondo.jpg");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;

      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 430px);
    }

    .card {
      padding: 24px 20px 20px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: rgba(18, 18, 18, 0.94);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .mp-label {
      color: var(--mp);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    h2 {
      margin: 7px 0 8px;
      font-size: 24px;
    }

    .intro {
      max-width: 330px;
      margin: 0 auto 20px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    .qr-wrap {
      width: min(70vw, 230px);
      margin: 0 auto 20px;
      padding: 10px;
      border-radius: 18px;
      background: #ffffff;
    }

    .qr-wrap img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .or {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 13px;
      color: #888888;
      font-size: 12px;
    }

    .or::before,
    .or::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .alias-title {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .alias-row {
      display: flex;
      gap: 9px;
    }

    .alias {
      flex: 1;
      min-width: 0;
      padding: 15px 10px;
      overflow-wrap: anywhere;
      border: 1px solid #3b3b3b;
      border-radius: 13px;
      background: #0a0a0a;
      color: #ffffff;
      font-size: clamp(16px, 5vw, 19px);
      font-weight: 700;
    }

    button {
      padding: 0 16px;
      border: 0;
      border-radius: 13px;
      background: var(--red);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    .note {
      margin: 18px 4px 0;
      color: #aaaaaa;
      font-size: 12px;
      line-height: 1.35;
    }

    .ok {
      color: #75d990;
    }

    footer {
      margin-top: 17px;
      color: #d0d0d0;
      font-size: 12px;
      text-shadow: 0 1px 3px #000000;
    }

    @media (max-height: 650px) {
      body {
        padding-top: 14px;
        padding-bottom: 14px;
      }

      .card {
        padding-top: 16px;
      }

      .qr-wrap {
        width: min(46vw, 180px);
        margin-bottom: 12px;
      }

      .intro {
        margin-bottom: 12px;
      }
    }

    @media (max-width: 480px) {
      body {
        background-attachment: scroll;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="card" aria-labelledby="titulo-donar">
      <div class="mp-label">MERCADO PAGO</div>

      <h2 id="titulo-donar">Colaborá con la radio</h2>

      <p class="intro">
        Escaneá el código QR o transferí al alias para apoyar a Sonomix Radio.
      </p>

      <div class="qr-wrap">
        <img
          src="qr-sonomixradio.png"
          alt="Código QR de Mercado Pago para colaborar con Sonomix Radio"
        >
      </div>

      <div class="or">O transferí al alias</div>

      <p class="alias-title">Alias Mercado Pago</p>

      <div class="alias-row">
        <div class="alias" id="alias">sonomixradio</div>
        <button type="button" id="copyButton" aria-label="Copiar alias">
          Copiar
        </button>
      </div>

      <p class="note">
        <span class="ok">●</span>
        Elegí <strong>Transferencia</strong> al pagar. Así colaborás directamente con la radio.
      </p>
    </section>

    <footer>Gracias por ser parte de Sonomix Radio.</footer>
  </main>

  <script>
    const button = document.getElementById("copyButton");
    const alias = document.getElementById("alias").textContent;

    button.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(alias);
      } catch {
        const input = document.createElement("input");
        input.value = alias;
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        input.remove();
      }

      button.textContent = "¡Copiado!";

      setTimeout(() => {
        button.textContent = "Copiar";
      }, 1800);
    });
  </script>
</body>
</html>
